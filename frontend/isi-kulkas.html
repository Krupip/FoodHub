<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Isi Kulkas | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,800;1,600&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="isi-kulkas" data-root="" data-access="">
  <header id="nav"></header>

  <main>
    <div class="container">
      <div class="ph">
        <h1>Punya bahan apa di kulkas?</h1>
        <p>Ketik bahan yang kamu miliki lalu tekan Enter. Garam, gula, minyak, dan air dianggap selalu tersedia.</p>
      </div>

      <form class="fridge" id="kf" novalidate>
        <label for="ki">Bahan di kulkas</label>
        <div class="fbox">
          <span id="kc" class="chips"></span>
          <input id="ki" type="text" placeholder="Contoh: telur" autocomplete="off">
          <button class="btn sm" id="kt" type="button"><i data-ic="plus"></i> Tambah</button>
        </div>

        <p class="sm" style="margin:.8rem 0 .4rem">Saran bahan</p>
        <div class="chips" id="ks"></div>

        <div class="opt">
          <label class="chk"><input type="checkbox" id="fk2"> Kurang maks. 2 bahan</label>
          <label class="chk"><input type="checkbox" id="fw2"> Waktu 30 menit atau kurang</label>
          <label class="chk"><input type="checkbox" id="fv2"> Tanpa daging</label>
          <button class="btn" type="submit"><i data-ic="search"></i> Cari resep</button>
        </div>
      </form>

      <div id="kr" style="margin-top:2rem" aria-live="polite"></div>
    </div>
  </main>

  <footer id="foot"></footer>

  <script src="js/main.js"></script>
</body>
</html>
