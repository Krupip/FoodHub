<!-- Deklarasi dokumen HTML5 -->
<!DOCTYPE html>
<html lang="id">
<!-- Bagian kepala: metadata, judul tab, ikon, dan file CSS -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Bagian badan: semua konten yang tampil di browser -->
<body data-page="masuk" data-root="" data-access="">
  <header id="nav"></header>

  <main>
    <div class="container auth">
      <form class="formbox" id="lf" novalidate>
        <h1>Masuk ke FoodHub</h1>
        <div class="err" id="er" hidden></div>

        <div class="fld">
          <label for="em">Email</label>
          <input id="em" type="email" autocomplete="email">
        </div>

        <div class="fld">
          <label for="pw">Kata sandi</label>
          <input id="pw" type="password" autocomplete="current-password">
        </div>

        <label class="chk fld">
          <input type="checkbox" id="ing"> Ingat saya
        </label>

        <button class="btn" type="submit" style="width:100%">Masuk</button>

        <p class="kecil" style="margin-top:1rem;text-align:center">
          Belum punya akun? <a href="daftar.html"><b>Daftar</b></a>
        </p>
      </form>
    </div>
  </main>

  <footer id="foot"></footer>
  <script src="js/main.js"></script>
</body>
</html>
