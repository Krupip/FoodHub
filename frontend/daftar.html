<!-- Deklarasi dokumen HTML5 -->
<!DOCTYPE html>
<html lang="id">
<!-- Bagian kepala: metadata, judul tab, ikon, dan file CSS -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Bagian badan: semua konten yang tampil di browser -->
<body data-page="daftar" data-root="" data-access="">
  <header id="navigasi"></header>

  <main>
    <div class="container auth">
      <form class="formbox" id="form-daftar" novalidate>
        <h1>Buat Akun FoodHub</h1>
        <div class="kotak-error" id="pesan-error" hidden></div>

        <div class="kolom-input">
          <label for="daftar-nama">Nama</label>
          <input id="daftar-nama" autocomplete="name" maxlength="40">
        </div>

        <div class="kolom-input">
          <label for="daftar-email">Email</label>
          <input id="daftar-email" type="email" autocomplete="email">
        </div>

        <div class="kolom-input">
          <label for="daftar-sandi">Kata sandi (min. 8 karakter)</label>
          <input id="daftar-sandi" type="password" autocomplete="new-password">
        </div>

        <div class="kolom-input">
          <label for="daftar-konfirmasi-sandi">Ulangi kata sandi</label>
          <input id="daftar-konfirmasi-sandi" type="password" autocomplete="new-password">
        </div>

        <label class="centang kolom-input">
          <input type="checkbox" id="daftar-setuju"> Saya setuju dengan syarat penggunaan FoodHub
        </label>

        <button class="tombol" type="submit" style="width:100%">Daftar</button>

        <p class="kecil" style="margin-top:1rem;text-align:center">
          Sudah punya akun? <a href="masuk.html"><b>Masuk</b></a>
        </p>
      </form>
    </div>
  </main>

  <footer id="kaki-halaman"></footer>
  <script src="js/main.js"></script>
</body>
</html>
