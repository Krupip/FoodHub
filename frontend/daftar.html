<!-- Deklarasi dokumen HTML5 -->
<!DOCTYPE html>
<html lang="id">
<!-- Bagian kepala: metadata, judul tab, ikon, dan file CSS -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Bagian badan: semua konten yang tampil di browser -->
<body data-page="daftar" data-root="" data-access="">
  <header id="nav"></header>

  <main>
    <div class="container auth">
      <form class="formbox" id="df" novalidate>
        <h1>Buat Akun FoodHub</h1>
        <div class="err" id="er" hidden></div>

        <div class="kolom-input">
          <label for="dn">Nama</label>
          <input id="dn" autocomplete="name" maxlength="40">
        </div>

        <div class="kolom-input">
          <label for="de">Email</label>
          <input id="de" type="email" autocomplete="email">
        </div>

        <div class="kolom-input">
          <label for="dp">Kata sandi (min. 8 karakter)</label>
          <input id="dp" type="password" autocomplete="new-password">
        </div>

        <div class="kolom-input">
          <label for="dk">Ulangi kata sandi</label>
          <input id="dk" type="password" autocomplete="new-password">
        </div>

        <label class="centang kolom-input" style="flex-direction:row;align-items:center;gap:0.5rem;display:flex;">
          <input type="checkbox" id="ds" style="width:auto;"> Saya setuju dengan syarat penggunaan FoodHub
        </label>

        <button class="btn" type="submit" style="width:100%">Daftar</button>

        <p class="kecil" style="margin-top:1rem;text-align:center">
          Sudah punya akun? <a href="masuk.html"><b>Masuk</b></a>
        </p>
      </form>
    </div>
  </main>

  <footer id="foot"></footer>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/publik.js"></script>
  <script src="js/navigasi.js"></script>
</body>
</html>
