<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="referrer" content="no-referrer">
  <title>Resep Nusantara | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="resep-nusantara" data-root="" data-access="">

      <div class="panel" id="mp" style="margin-top:1rem"></div>

      <div class="nus">
        <div id="pv"></div>
        <div class="grid" id="pr"></div>
      </div>

  <footer id="foot"></footer>
