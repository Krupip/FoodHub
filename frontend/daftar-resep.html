<!-- Deklarasi dokumen HTML5 -->
<!DOCTYPE html>
<html lang="id">
<!-- Bagian kepala: metadata, judul tab, ikon, dan file CSS -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Resep | FoodHub</title>
  <link rel="icon" href="img/logo-foodhub.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Bagian badan: semua konten yang tampil di browser -->
<body data-page="daftar-resep" data-root="" data-access="">
  <header id="nav"></header>

  <main>
    <div class="container" style="margin-top:1.5rem;">
      <div class="panel" style="margin-bottom:1.5rem;">
        <h1 style="margin:0 0 0.4rem;">Semua Resep</h1>
        <p class="muted" style="margin:0;">Cari berdasarkan nama, bahan, kategori, waktu memasak, atau tingkat kesulitan.</p>
      </div>

      <div class="filters" style="margin-bottom:1.5rem;">
        <div style="flex:2;min-width:240px;">
          <label class="sm" for="fq"><b>Cari Resep</b></label>
          <input id="fq" type="search" placeholder="Nama resep atau bahan..." style="margin-top:0.3rem;">
        </div>
        <div style="flex:1;min-width:180px;">
          <label class="sm" for="fk"><b>Kategori</b></label>
          <select id="fk" style="margin-top:0.3rem;">
            <option value="">Semua Kategori</option>
            <option value="Makanan Berat">Makanan Berat</option>
            <option value="Sehat">Sehat</option>
            <option value="Kue">Kue</option>
            <option value="Minuman">Minuman</option>
            <option value="Cepat">Cepat</option>
            <option value="Anak Kos">Anak Kos</option>
          </select>
        </div>
      </div>

      <div class="grid" id="rl"></div>
    </div>
  </main>

  <footer id="foot">
    <div class="container" style="padding:1rem 0;">
      <p style="margin:0 0 0.4rem;">&copy; 2026 <strong>FoodHub</strong> &bull; Platform Resep Makanan Digital Nusantara.</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/publik.js"></script>
  <script src="js/navigasi.js"></script>
</body>
</html>
